<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Canyon — a sunset valley flight</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: #1a1420;
    color: #ffe9c4;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
    -webkit-user-select: none;
    user-select: none;
  }
  #app { position: fixed; inset: 0; }
  .scene-holder { position: absolute; inset: 0; }
  .scene-holder canvas { display: block; width: 100%; height: 100%; }

  .hud { position: absolute; inset: 0; pointer-events: none; z-index: 5; transition: opacity .3s; }
  .hud.dimmed { opacity: .3; }
  .panel {
    position: absolute;
    background: rgba(10, 14, 24, .55);
    border: 1px solid rgba(255, 180, 80, .4);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .top-left { top: 14px; left: 14px; min-width: 190px; }
  .top-right { top: 14px; right: 14px; min-width: 230px; text-align: right; }
  .bottom-left { bottom: 14px; left: 14px; }
  .bottom-right { bottom: 14px; right: 14px; }
  .label { font-size: 11px; letter-spacing: 2px; color: #8fd8ff; opacity: .9; }
  .big { font-size: 30px; font-weight: 700; color: #ffd27a; line-height: 1.05; }
  .unit { font-size: 12px; color: #8fd8ff; margin-left: 5px; }
  .row { font-size: 15px; margin-top: 5px; }
  .lives { color: #ffd27a; letter-spacing: 2px; }
  .gauge { display: flex; align-items: baseline; gap: 7px; justify-content: flex-end; margin: 2px 0; }
  .fuel { margin-top: 8px; }
  .bar { width: 160px; height: 10px; background: rgba(255, 255, 255, .16); border-radius: 5px; overflow: hidden; margin-top: 4px; }
  .bar .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #37d67a, #ffb020); }
  .bar .fill.low { background: #ff5340; }
  .bar.vertical { width: 12px; height: 92px; margin: 6px auto 4px; position: relative; }
  .bar.vertical .fill { position: absolute; bottom: 0; left: 0; right: 0; height: 0%; background: linear-gradient(0deg, #37d67a, #ffb020); }
  .bottom-left { text-align: center; }

  .horizon {
    width: 92px; height: 92px; border-radius: 50%;
    border: 2px solid rgba(255, 210, 122, .65);
    overflow: hidden; position: relative; margin: 6px auto 0;
    background: linear-gradient(#7fb2e8 50%, #7a5230 50%);
  }
  .horizon-line { position: absolute; left: -12%; right: -12%; top: 50%; height: 2px; margin-top: -1px; background: #fff; }
  .horizon-centre {
    position: absolute; left: 50%; top: 50%; width: 26px; height: 10px; margin: -5px 0 0 -13px;
    border-left: 9px solid #ffd27a; border-right: 9px solid #ffd27a; border-top: 2px solid transparent;
  }

  .centre { position: absolute; left: 50%; top: 15%; transform: translateX(-50%); text-align: center; width: 640px; max-width: 80vw; }
  .ring-pointer {
    display: inline-block; font-size: 17px; font-weight: 700; color: #ffd27a;
    background: rgba(10, 14, 24, .55); border: 1px solid rgba(255, 180, 80, .4);
    padding: 6px 14px; border-radius: 8px; opacity: 0;
  }
  .ring-pointer.show { opacity: 1; }
  .message { margin-top: 12px; font-size: 21px; font-weight: 700; color: #fff; text-shadow: 0 2px 10px rgba(0, 0, 0, .7); opacity: 0; transition: opacity .25s; }
  .message.show { opacity: 1; }

  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 4vh;
    background: radial-gradient(ellipse at center, rgba(10, 10, 20, .22), rgba(10, 10, 20, .62));
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay-card {
    text-align: center; max-width: 660px; margin: 0 20px;
    padding: 30px 38px;
    background: rgba(8, 12, 22, .66);
    border: 1px solid rgba(255, 180, 80, .45);
    border-radius: 16px;
  }
  .overlay-card h1 { font-size: 54px; letter-spacing: 7px; color: #ffd27a; margin: 0 0 10px; text-shadow: 0 3px 18px rgba(255, 140, 40, .45); }
  .overlay-card .sub { font-size: 17px; margin: 0 0 14px; }
  .overlay-card .ctl { font-size: 15px; margin: 7px 0; color: #cfe6ff; }
  .overlay-card .ctl b { color: #ffd27a; }
  .overlay-card .best { margin-top: 12px; color: #37d67a; font-size: 15px; letter-spacing: 1px; }
  .overlay-card .stats { font-size: 17px; margin: 8px 0; }
  .overlay-card .stats b { color: #ffd27a; }
  .overlay-card .detail { font-size: 14px; color: #cfe6ff; margin-top: 8px; }
  .overlay-card .hint { font-size: 16px; letter-spacing: 2px; color: #ffd27a; margin: 20px 0 0; animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
